<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>恋人のささやき · 可配置API</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '黑体', 'Microsoft YaHei', -apple-system, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e1e2a;
            padding: 12px;
        }
        #app {
            width: 100%;
            max-width: 480px;
            height: 820px;
            max-height: 95vh;
            background: transparent;
            border-radius: 36px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }
        .page {
            width: 100%;
            height: 100%;
            transition: opacity 0.3s;
            background: rgba(245, 235, 240, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 20px 18px;
            overflow-y: auto;
        }
        .hidden {
            display: none;
        }
        /* 登录页/配置页 */
        #login-page {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        #login-page h2 {
            font-size: 2rem;
            font-weight: 300;
            color: #4a3740;
            text-align: center;
            margin-top: 10px;
            letter-spacing: 2px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-size: 0.95rem;
            color: #4a3a44;
            font-weight: 500;
            margin-left: 6px;
        }
        .input-group input, .input-group textarea {
            padding: 14px 18px;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            font-size: 1rem;
            border: 1px solid rgba(255, 220, 230, 0.8);
            outline: none;
            color: #2e1e26;
            width: 100%;
        }
        .input-group textarea {
            min-height: 70px;
            resize: vertical;
        }
        .row-flex {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .row-flex .input-group {
            flex: 1;
        }
        .test-btn {
            background: #b88b9d;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.4);
            transition: 0.2s;
            margin-top: 18px;
        }
        .test-btn:hover {
            background: #a07488;
        }
        .primary-btn {
            background: #b27f92;
            border: none;
            color: white;
            font-size: 1.3rem;
            padding: 16px 0;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 400;
            letter-spacing: 2px;
            margin-top: 16px;
            border: 1px solid rgba(255,255,255,0.4);
            transition: 0.2s;
        }
        .primary-btn:hover {
            background: #9e6c7f;
            transform: scale(1.02);
        }
        .test-result {
            background: rgba(0,0,0,0.1);
            padding: 12px;
            border-radius: 28px;
            font-size: 0.95rem;
            color: #3e2e36;
            max-height: 80px;
            overflow-y: auto;
            border: 1px dashed rgba(160,100,120,0.3);
        }
        .test-success {
            color: #1d6b2e;
            background: rgba(70, 180, 100, 0.15);
        }
        .test-fail {
            color: #a13030;
            background: rgba(200, 70, 70, 0.1);
        }

        /* 聊天页 */
        #chat-page {
            padding: 0;
            display: flex;
            flex-direction: column;
            background: transparent;
            backdrop-filter: blur(12px);
            border-radius: 36px;
            overflow: hidden;
            position: relative;
        }
        .decorations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .top-left-knight {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 32px;
            color: rgba(245, 240, 255, 0.6);
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
            z-index: 0;
            transform: rotate(-5deg);
        }
        .bottom-right-tower {
            position: absolute;
            bottom: 100px;
            right: 20px;
            font-size: 48px;
            color: rgba(250, 245, 240, 0.6);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
            z-index: 0;
        }
        .chat-main {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: transparent;
        }
        .chat-header {
            padding: 20px 16px 8px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 300;
            color: #3e2e36;
            background: transparent;
            backdrop-filter: blur(2px);
            border-bottom: 1px solid rgba(255,255,255,0.25);
        }
        .chat-header i {
            color: #dc9aa8;
            margin-right: 8px;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .message {
            display: flex;
            width: 100%;
        }
        .message.lover {
            justify-content: flex-start;
        }
        .message.user {
            justify-content: flex-end;
        }
        .bubble {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 28px;
            font-size: 1rem;
            line-height: 1.4;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            backdrop-filter: blur(4px);
            word-break: break-word;
        }
        .lover .bubble {
            background: rgba(245, 215, 225, 0.75);
            border-bottom-left-radius: 6px;
            color: #2f1f27;
        }
